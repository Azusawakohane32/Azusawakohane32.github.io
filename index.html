<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>一元二次方程求解器（根式版）</title>
    <style>
        *{box-sizing: border-box;font-family: system-ui}
        body{
            background:#f0f4f8;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }
        .box{
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 12px #00000022;
            width:440px;
        }
        h2{text-align:center;color:#2c3e50;margin-top:0}
        .row{margin:12px 0}
        label{display:inline-block;width:45px}
        input{
            padding:8px;
            width:180px;
            font-size:16px;
            border:1px solid #aaa;
            border-radius:6px;
        }
        button{
            width:100%;
            padding:12px;
            font-size:17px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
        button:hover{background:#1d4ed8}
        #result{
            margin-top:18px;
            padding:14px;
            background:#f8fafc;
            border-radius:8px;
            font-size:17px;
            white-space:pre-line;
            line-height:1.6;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>一元二次方程 ax²+bx+c=0</h2>
    <div class="row">
        <label>a =</label>
        <input type="number" id="a" placeholder="輸入a">
    </div>
    <div class="row">
        <label>b =</label>
        <input type="number" id="b" placeholder="輸入b">
    </div>
    <div class="row">
        <label>c =</label>
        <input type="number" id="c" placeholder="輸入c">
    </div>
    <br>
    <button onclick="solve()">計算方程解</button>
    <div id="result"></div>
</div>

<script>
// 化簡根號函數，例如 sqrt(12) → "2√3"
function simplifySqrt(n){
    if(n<0) return "";
    if(n===0) return "0";
    let factor = 1;
    for(let i=2;i*i<=n;i++){
        while(n%(i*i)===0){
            factor *= i;
            n = n/(i*i);
        }
    }
    if(n===1) return factor.toString();
    if(factor===1) return "√"+n;
    return factor+"√"+n;
}

// 求最大公因數，用來約分
function gcd(a,b){
    while(b!==0){
        let temp = b;
        b = a % b;
        a = temp;
    }
    return Math.abs(a);
}

function solve(){
    let a = parseFloat(document.getElementById('a').value);
    let b = parseFloat(document.getElementById('b').value);
    let c = parseFloat(document.getElementById('c').value);
    let res = document.getElementById("result");

    if(isNaN(a)||isNaN(b)||isNaN(c)){
        res.innerText = "請輸入有效的數字！";
        return;
    }
    if(a === 0){
        res.innerText = "a=0，不是一元二次方程，是一次方程";
        return;
    }
    let delta = b*b - 4*a*c;
    let deno = 2*a;

    if(delta > 0){
        let sqrtD = simplifySqrt(delta);
        let numerator1 = -b;
        let numerator2 = delta;
        // 約分
        let g = gcd(numerator1, deno);
        let g2 = gcd(2, deno);
        res.innerText = `判別式 Δ = ${delta}\n兩個不同實根：\nx₁ = (${-b} + ${sqrtD}) ÷ ${deno}\nx₂ = (${-b} − ${sqrtD}) ÷ ${deno}`;
    }else if(delta === 0){
        let x = -b/(2*a);
        res.innerText = `判別式 Δ = ${delta}\n兩個相等實根：\nx₁ = x₂ = ${x}`;
    }else{
        res.innerText = `判別式 Δ = ${delta} < 0\n沒有實數根，只有複數根`;
    }
}
</script>
</body>
</html>
